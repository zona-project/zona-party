<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05060b">

    <title>ZONA | ENTRY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
     <canvas id="snowCanvas"></canvas>
    <div class="background"></div>
    <div class="overlay"></div>

    <main class="page">

        <section class="hero">

            <div class="logo">
                <span class="logo-main">ZONA</span>
                <span class="logo-sub">HOUSE PARTY</span>
            </div>

            <p class="event-date">
                12.26 — 12.27
            </p>

            <h1>
                <span>GREAT NIGHT.</span>
            </h1>

            <p class="hero-description">
                ZONA PRIVATE HOUSE PARTY
            </p>

        </section>


        <section class="form-card">

            <div class="step">
                <span class="step-number">01</span>

                <div>
                    <p class="step-small">ENTRY</p>
                    <h2>参加申込</h2>
                </div>
            </div>

            <p class="form-description">
                下記の情報を入力してください。
            </p>

            <form id="eventForm">

                <div class="field">

                    <label for="name">
                        NAME
                        <span>お名前</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="山田 太郎"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="field">

                    <label for="phone">
                        PHONE
                        <span>電話番号</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09012345678"
                        autocomplete="tel"
                        inputmode="tel"
                        required
                    >

                </div>


                <div class="field">

                    <label for="instagram">
                        INSTAGRAM
                        <span>Instagram ID</span>
                    </label>

                    <input
                        type="text"
                        id="instagram"
                        name="instagram"
                        placeholder="@example"
                        autocapitalize="none"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        GENDER
                        <span>性別</span>
                    </label>

                    <div class="gender-box">

                        <label class="gender-option">

                            <input
                                type="radio"
                                name="gender"
                                value="男性"
                                required
                            >

                            <span>MEN</span>

                        </label>


                        <label class="gender-option">

                            <input
                                type="radio"
                                name="gender"
                                value="女性"
                            >

                            <span>WOMEN</span>

                        </label>

                    </div>

                </div>


                <button type="submit" class="main-button">

                    <span>NEXT</span>

                    <span class="arrow">→</span>

                </button>

            </form>

            <p class="privacy">
                入力いただいた情報はイベント運営・参加確認の目的で使用します。
            </p>

        </section>


        <footer>

            <span>ZONA</span>

            <p>
                PRIVATE HOUSE PARTY
            </p>

        </footer>



    </main>

    <script>
const canvas = document.getElementById("snowCanvas");
const ctx = canvas.getContext("2d");

let width;
let height;
let snowflakes = [];

function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width;
    canvas.height = height;
}

function createSnowflake() {
    return {
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 3 + 1,
        speed: Math.random() * 1.5 + 0.5,
        drift: Math.random() * 0.6 - 0.3,
        opacity: Math.random() * 0.6 + 0.4
    };
}

function initSnow() {
    snowflakes = [];

    for (let i = 0; i < 120; i++) {
        snowflakes.push(createSnowflake());
    }
}

function drawSnow() {

    ctx.clearRect(0, 0, width, height);

    snowflakes.forEach(flake => {

        ctx.beginPath();

        ctx.arc(
            flake.x,
            flake.y,
            flake.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${flake.opacity})`;

        ctx.fill();

        flake.y += flake.speed;
        flake.x += flake.drift;

        if (flake.y > height) {
            flake.y = -10;
            flake.x = Math.random() * width;
        }

        if (flake.x > width) {
            flake.x = 0;
        }

        if (flake.x < 0) {
            flake.x = width;
        }
    });

    requestAnimationFrame(drawSnow);
}

resizeCanvas();
initSnow();
drawSnow();

window.addEventListener("resize", () => {
    resizeCanvas();
    initSnow();
});
</script>


    <script src="script.js"></script>






</body>

</html>
